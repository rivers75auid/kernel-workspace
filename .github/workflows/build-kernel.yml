name: Android Kernel Build Engine (Custom Linux 4.19 Pipeline)

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: 'Custom Kernel Name'
        required: true
        default: 'Kairos'
      KERNEL_REPO:
        description: 'Kernel Source Repository (owner/repo)'
        required: true
        default: 'alternoegraha/kernel_xiaomi_sm6225'
      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'fog'
      DEFCONFIG:
        description: 'Defconfig name'
        required: true
        default: 'vendor/fog-perf_defconfig'
      ENABLE_RESUKISU:
        description: 'Integrate ReSukiSU'
        required: true
        type: boolean
        default: true
      ENABLE_SUSFS:
        description: 'Integrate SUSFS'
        required: true
        type: boolean
        default: true
      SUSFS_VERSION_TAG:
        description: 'SUSFS Header Version Tag'
        required: true
        default: 'v2.3.0'
      ENABLE_POTATO_SUITE:
        description: 'Enable Potato Tuning Suite (WALT/Schedtune, Anxiety I/O, MGLRU, KSM, ZRAM DEDUP, Zero-Debloat)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'configs/**'
      - 'scripts/**'
      - 'patches/**'

jobs:
  build:
    name: Build Kernel (SUSFS)
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python-is-python3 \
            python3 \
            tar \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Download ZyC Clang 16 Toolchain (Polly Optimized)
        run: |
          echo "===> Downloading ZyC Clang 16.0.6 (Optimized for Cortex-A73/A53 & Snapdragon 680)..."
          mkdir -p "$GITHUB_WORKSPACE/zyc-clang"
          curl -sSL "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" | tar -xz -C "$GITHUB_WORKSPACE/zyc-clang"

      - name: Clone Kernel Source
        run: |
          REPO="${{ github.event.inputs.KERNEL_REPO }}"
          [ -z "$REPO" ] && REPO="alternoegraha/kernel_xiaomi_sm6225"
          BRANCH="${{ github.event.inputs.KERNEL_BRANCH }}"
          [ -z "$BRANCH" ] && BRANCH="fog"

          echo "===> Cloning Canonical Kernel Source from $REPO ($BRANCH)..."
          git clone --depth=1 "https://github.com/$REPO.git" -b "$BRANCH" "$GITHUB_WORKSPACE/kernel_source"

      - name: Setup ReSukiSU & SUSFS Patches
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/setup-ksu-susfs.sh"
          bash "$GITHUB_WORKSPACE/scripts/setup-ksu-susfs.sh" \
            "${{ github.event.inputs.ENABLE_RESUKISU || 'true' }}" \
            "true" \
            "${{ github.event.inputs.SUSFS_VERSION_TAG || 'v2.3.0' }}" \
            "${{ github.event.inputs.DEFCONFIG || 'vendor/fog-perf_defconfig' }}"

      - name: Apply Custom Kernel Name & Potato Suite Optimizations
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"
          OPT_POTATO="${{ github.event.inputs.ENABLE_POTATO_SUITE }}"
          [ -z "$OPT_POTATO" ] && OPT_POTATO="true"
          KNAME="${{ github.event.inputs.KERNEL_NAME }}"
          [ -z "$KNAME" ] && KNAME="Kairos"

          DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          [ -z "$DEFCONFIG" ] && DEFCONFIG="vendor/fog-perf_defconfig"
          DEFCONFIG_PATH="arch/arm64/configs/$DEFCONFIG"

          echo "===> Setting Kernel Name to: $KNAME..."
          sed -i '/CONFIG_LOCALVERSION/d' "$DEFCONFIG_PATH"
          echo "CONFIG_LOCALVERSION=\"-${KNAME}\"" >> "$DEFCONFIG_PATH"

          echo "===> Fixing yamltree.o duplicate & hostprogs in scripts/dtc/Makefile..."
          cp "$GITHUB_WORKSPACE/patches/dtc_Makefile" scripts/dtc/Makefile

          echo "===> Fixing MemAvailable overflow / MGLRU counter leak..."
          python3 "$GITHUB_WORKSPACE/scripts/patch-memavailable.py"

          echo "===> Enabling Novatek touchscreen ESD recovery & edge ghost-touch fix..."
          python3 "$GITHUB_WORKSPACE/scripts/patch-touch.py"

          echo "===> Enabling SMB1351 HVDCP_3 (Quick Charge 3.0 18W) notification fix..."
          python3 "$GITHUB_WORKSPACE/scripts/patch-charger.py"

          if [ "$OPT_POTATO" = "true" ]; then
            echo "===> Enabling Potato Tuning Suite (WALT/Schedtune, Anxiety, MGLRU, KSM, ZRAM DEDUP, Zero-Debloat)..."
            # Strip competing Kconfig choice defaults so potato.config wins cleanly
            sed -i '/CONFIG_CPU_FREQ_DEFAULT_GOV/d' "$DEFCONFIG_PATH"
            sed -i '/CONFIG_DEFAULT_IOSCHED/d' "$DEFCONFIG_PATH"
            sed -i '/CONFIG_DEFAULT_CFQ/d' "$DEFCONFIG_PATH"
            sed -i '/CONFIG_DEFAULT_WESTWOOD/d' "$DEFCONFIG_PATH"
            cat "$GITHUB_WORKSPACE/configs/potato.config" >> "$DEFCONFIG_PATH"
          fi

      - name: Build Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"
          DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          [ -z "$DEFCONFIG" ] && DEFCONFIG="vendor/fog-perf_defconfig"
          KNAME="${{ github.event.inputs.KERNEL_NAME }}"
          [ -z "$KNAME" ] && KNAME="Kairos"

          export PATH="$GITHUB_WORKSPACE/zyc-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="${KNAME}-Dev"
          export KBUILD_BUILD_HOST="Olympus-Buildbox"

          mkdir -p out
          echo "===> Mengonfigurasi defconfig: $DEFCONFIG..."
          make -j$(nproc --all) ARCH=arm64 O=out "$DEFCONFIG"

          # Resolve semua NEW symbols non-interaktif sebelum build,
          # agar syncconfig tidak Restart config dan mereset opsi kita
          echo "===> Menyelesaikan NEW symbols non-interaktif (yes olddefconfig)..."
          yes "" | make -j$(nproc --all) ARCH=arm64 O=out olddefconfig

          echo "===> Verifikasi hasil konfigurasi kritis:"
          grep -E "CONFIG_RD_LZ4|CONFIG_USERFAULTFD|CONFIG_ANDROID_PARANOID_NETWORK|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_SUSFS|CONFIG_IOSCHED_ANXIETY" out/.config

          echo "===> Mengompilasi Kernel..."
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbo.img dtb.img || \
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          echo "===> Menyiapkan AnyKernel3..."
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"
          cd "$GITHUB_WORKSPACE/AnyKernel3"

          KNAME="${{ github.event.inputs.KERNEL_NAME }}"
          [ -z "$KNAME" ] && KNAME="Kairos"

          # Terapkan anykernel.sh terkonfigurasi khusus Redmi 10C (BLOCK=boot & slot auto)
          cp "$GITHUB_WORKSPACE/configs/anykernel.sh" .
          sed -i "s/Kairos/${KNAME}/g" anykernel.sh

          # Copy Potato optimizer runtime script
          cp "$GITHUB_WORKSPACE/scripts/99-potato-fog.sh" .
          chmod 755 99-potato-fog.sh

          OUT_DIR="$GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot"

          # Salin file kernel hasil build
          if [ -f "$OUT_DIR/Image.gz-dtb" ]; then
            echo "Menemukan Image.gz-dtb"
            cp "$OUT_DIR/Image.gz-dtb" .
          elif [ -f "$OUT_DIR/Image.gz" ]; then
            echo "Menemukan Image.gz"
            cp "$OUT_DIR/Image.gz" .
          elif [ -f "$OUT_DIR/Image" ]; then
            echo "Menemukan Image"
            cp "$OUT_DIR/Image" .
          else
            echo "ERROR: Tidak ditemukan Image hasil kompilasi!"
            exit 1
          fi

          # Salin dtbo.img jika ada
          if [ -f "$OUT_DIR/dtbo.img" ]; then
            echo "Menemukan dtbo.img"
            cp "$OUT_DIR/dtbo.img" .
          fi

          # Salin dtb jika ada
          if [ -f "$OUT_DIR/dtb.img" ]; then
            echo "Menemukan dtb.img"
            cp "$OUT_DIR/dtb.img" dtb
          elif [ -f "$OUT_DIR/dtb" ]; then
            echo "Menemukan dtb"
            cp "$OUT_DIR/dtb" .
          fi

          DATE=$(date +'%Y%m%d-%H%M')
          ZIP_NAME="${KNAME}-SUSFS-Potato-fog-${DATE}.zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder

          mkdir -p "$GITHUB_WORKSPACE/output"
          mv "$ZIP_NAME" "$GITHUB_WORKSPACE/output/"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: output/*
          retention-days: 14
          compression-level: 6

      - name: Send Telegram Notification & File
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ] && exit 0

          JOB_STATUS="${{ job.status }}"
          VARIANT="SUSFS"
          ZIP_FILE="$GITHUB_WORKSPACE/output/${{ env.ZIP_NAME }}"

          if [ "$JOB_STATUS" = "success" ]; then
            MSG="✅ *Kernel Build Success!*%0A%0A*Device:* Redmi 10C (fog)%0A*Variant:* ${VARIANT}%0A*Package:* \`${{ env.ZIP_NAME }}\`%0A*Commit:* \`${{ github.sha }}\`"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=Markdown"

            if [ -f "$ZIP_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$ZIP_FILE" 2>/dev/null || stat -f%z "$ZIP_FILE" 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -lt 49000000 ]; then
                echo "===> Uploading ZIP to Telegram..."
                curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                  -F "document=@${ZIP_FILE}" \
                  -F "caption=🚀 Flashable Kernel ZIP (${VARIANT})" \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
              fi
            fi
          else
            MSG="❌ *Kernel Build Failed!*%0A%0A*Device:* Redmi 10C (fog)%0A*Variant:* ${VARIANT}%0A*Commit:* \`${{ github.sha }}\`%0A*Run:* [View Action Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=Markdown"
          fi
