name: Build Redmi 10C Kernel (KernelSU-Next + SUSFS v2.3.0 + Godmode Potato Suite)

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: 'Custom Kernel Name (Tampil di Settings > About Phone)'
        required: true
        default: 'Kairos'
      KERNEL_REPO:
        description: 'Kernel Source Repository (owner/repo)'
        required: true
        default: 'iDead-Project/ai-kernel_xiaomi_sm6225'
      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'aistrix-ext'
      DEFCONFIG:
        description: 'Defconfig name'
        required: true
        default: 'vendor/fog-perf_defconfig'
      ENABLE_KSU_NEXT:
        description: 'Integrate KernelSU-Next'
        required: true
        type: boolean
        default: true
      ENABLE_SUSFS:
        description: 'Integrate SUSFS'
        required: true
        type: boolean
        default: true
      SUSFS_VERSION_TAG:
        description: 'SUSFS Header Version Tag'
        required: true
        default: 'v2.3.0'
      ENABLE_GODMODE_POTATO:
        description: 'Enable Godmode Suite (FAS/UCLAMP, BFQ/Anxiety, MGLRU, KSM, ZRAM DEDUP, Zero-Debloat)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-kernel.yml'

jobs:
  build:
    name: Compile Android Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            tar \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Download Proton Clang Toolchain
        run: |
          echo "===> Downloading Proton Clang 13..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/proton-clang"

      - name: Clone Kernel Source
        run: |
          REPO="${{ github.event.inputs.KERNEL_REPO || 'iDead-Project/ai-kernel_xiaomi_sm6225' }}"
          BRANCH="${{ github.event.inputs.KERNEL_BRANCH || 'aistrix-ext' }}"
          echo "===> Cloning Kernel Source from $REPO ($BRANCH)..."
          git clone --depth=1 "https://github.com/$REPO.git" -b "$BRANCH" "$GITHUB_WORKSPACE/kernel_source"

      - name: Setup KernelSU-Next & SUSFS Patches
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"

          ENABLE_KSU="${{ github.event_name == 'push' && 'true' || github.event.inputs.ENABLE_KSU_NEXT }}"
          ENABLE_SUS="${{ github.event_name == 'push' && 'true' || github.event.inputs.ENABLE_SUSFS }}"
          SUS_VER="${{ github.event.inputs.SUSFS_VERSION_TAG || 'v2.3.0' }}"

          if [ "$ENABLE_KSU" = "true" ]; then
            echo "===> Inisialisasi KernelSU-Next (Latest Next Branch)..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

            if [ "$ENABLE_SUS" = "true" ]; then
              echo "===> Mengambil Patch SUSFS 4.19 (Latest Upstream simonpunk)..."
              git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git "$GITHUB_WORKSPACE/susfs4ksu"

              echo "===> Menyesuaikan versi SUSFS Header ke $SUS_VER (Sinkron modul terbaru)..."
              sed -i "s/#define SUSFS_VERSION .*/#define SUSFS_VERSION \"$SUS_VER\"/" "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h"

              echo "===> Menerapkan source code SUSFS ke kernel..."
              cp -r "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs"/* fs/
              cp -r "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux"/* include/linux/

              echo "===> Menerapkan patch SUSFS ke kernel tree..."
              patch -p1 --forward < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch" || echo "[WARN] Sebagian patch kernel mungkin sudah terpasang"

              echo "===> Menerapkan patch SUSFS ke KernelSU-Next..."
              if [ -d "KernelSU-Next" ]; then
                cd KernelSU-Next
                patch -p1 --forward < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || echo "[WARN] Patch KernelSU sudah terpasang"
                cd ..
              elif [ -d "drivers/kernelsu" ]; then
                cd drivers/kernelsu
                patch -p1 --forward < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || echo "[WARN] Patch KernelSU sudah terpasang"
                cd ../..
              fi

              echo "===> Mengaktifkan config KernelSU & SUSFS di defconfig..."
              DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.DEFCONFIG || 'vendor/fog-perf_defconfig' }}"
              cat << 'EOF' >> "$DEFCONFIG_PATH"

          # KernelSU-Next & SUSFS v2.3.0 Configuration
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSUD=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF
            fi
          fi

      - name: Apply Custom Kernel Name & Godmode Potato Optimizations
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"
          OPT_GOD="${{ github.event_name == 'push' && 'true' || github.event.inputs.ENABLE_GODMODE_POTATO }}"
          KNAME="${{ github.event_name == 'push' && 'Kairos' || github.event.inputs.KERNEL_NAME || 'Kairos' }}"
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.DEFCONFIG || 'vendor/fog-perf_defconfig' }}"

          echo "===> Menyetel Nama Kernel ke: $KNAME..."
          sed -i '/CONFIG_LOCALVERSION/d' "$DEFCONFIG_PATH"
          echo "CONFIG_LOCALVERSION=\"-${KNAME}\"" >> "$DEFCONFIG_PATH"

          if [ "$OPT_GOD" = "true" ]; then
            echo "===> Mengaktifkan Godmode Potato Suite (UCLAMP, BFQ/Anxiety, MGLRU, KSM, ZRAM DEDUP, Zero-Debloat)..."
            cat << 'EOF' >> "$DEFCONFIG_PATH"

          # ==============================================================
          # 1. CPU Scheduling, FAS / UCLAMP & Governor Foundation
          # ==============================================================
          CONFIG_UCLAMP_TASK=y
          CONFIG_UCLAMP_TASK_GROUP=y
          CONFIG_UCLAMP_BUCKETS_COUNT=20
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y

          # ==============================================================
          # 2. Storage I/O Optimization (BFQ & Anxiety Schedulers)
          # ==============================================================
          CONFIG_IOSCHED_BFQ=y
          CONFIG_BFQ_GROUP_IOSCHED=y
          CONFIG_IOSCHED_ANXIETY=y
          CONFIG_MQ_IOSCHED_DEADLINE=y

          # ==============================================================
          # 3. Memory Subsystem (MGLRU, KSM, ZRAM DEDUP, Z3FOLD, ZSTD)
          # ==============================================================
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          # CONFIG_LRU_GEN_STATS is not set
          CONFIG_KSM=y
          CONFIG_ZPOOL=y
          CONFIG_Z3FOLD=y
          CONFIG_ZSWAP=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEDUP=y
          CONFIG_ZRAM_DEF_COMP_ZSTD=y
          CONFIG_ZRAM_DEF_COMP="zstd"
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_CRYPTO_ZSTD=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_PROCESS_RECLAIM=y
          CONFIG_COMPACTION=y
          CONFIG_PAGE_BOUNCE=y

          # ==============================================================
          # 4. Kernel Debloat: Stripping Debug & Tracing Bloat (~200MB RAM)
          # ==============================================================
          # CONFIG_DEBUG_KMEMLEAK is not set
          # CONFIG_PAGE_OWNER is not set
          # CONFIG_DEBUG_SPINLOCK is not set
          # CONFIG_DEBUG_MUTEXES is not set
          # CONFIG_FTRACE is not set
          # CONFIG_DYNAMIC_DEBUG is not set
          CONFIG_SLUB_DEBUG=n

          # ==============================================================
          # 5. Network Latency & Bufferbloat Mitigation (BBR + FQ)
          # ==============================================================
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ_CODEL=y
          EOF
          fi

      - name: Build Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"
          DEFCONFIG="${{ github.event.inputs.DEFCONFIG || 'vendor/fog-perf_defconfig' }}"
          KNAME="${{ github.event_name == 'push' && 'Kairos' || github.event.inputs.KERNEL_NAME || 'Kairos' }}"

          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="${KNAME}-Dev"
          export KBUILD_BUILD_HOST="Olympus-Buildbox"

          mkdir -p out
          echo "===> Mengonfigurasi defconfig: $DEFCONFIG..."
          make O=out "$DEFCONFIG"

          echo "===> Mengompilasi Kernel..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          echo "===> Menyiapkan AnyKernel3..."
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"
          cd "$GITHUB_WORKSPACE/AnyKernel3"

          KNAME="${{ github.event_name == 'push' && 'Kairos' || github.event.inputs.KERNEL_NAME || 'Kairos' }}"

          # Konfigurasi perangkat Redmi 10C (fog, wind, rain)
          sed -i "s/kernel.string=.*/kernel.string=${KNAME} Kernel for Redmi 10C (fog)/" anykernel.sh
          sed -i 's/device.name1=.*/device.name1=fog/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=wind/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=rain/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=sm6225/' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/' anykernel.sh

          # Tambahkan script runtime Godmode Potato optimizer ke AnyKernel3
          cat << 'EOF' >> anykernel.sh

          # Injeksi script runtime Godmode Potato Suite untuk Android 16
          if [ -d "/data/adb/service.d" ]; then
            cat << 'SCRIPT' > /data/adb/service.d/99-godmode-potato-fog.sh
          #!/system/bin/sh
          # Tunggu sistem Android selesai boot sepenuhnya
          while [ "$(getprop sys.boot_completed)" != "1" ]; do
            sleep 2
          done

          # ==============================================================
          # 1. CPU Scheduling: FAS (Frame Aware Scheduling) & Schedutil
          # ==============================================================
          for gov in /sys/devices/system/cpu/cpufreq/policy*/schedutil; do
            [ -d "$gov" ] || continue
            echo 500 > "$gov/up_rate_limit_us" 2>/dev/null || true
            echo 20000 > "$gov/down_rate_limit_us" 2>/dev/null || true
            echo 1000 > "$gov/rate_limit_us" 2>/dev/null || true
          done

          # UCLAMP (Per-Process Utilization Clamping)
          # Top-App (UI & Game aktif): Kunci ke Core Big (A73) dengan minimum boost 20%
          if [ -d "/dev/cpuset/top-app" ]; then
            echo 0-7 > /dev/cpuset/top-app/cpus
            echo 20 > /dev/cpuctl/top-app/uclamp.min 2>/dev/null || true
            echo 100 > /dev/cpuctl/top-app/uclamp.max 2>/dev/null || true
            echo 1 > /dev/cpuctl/top-app/uclamp.latency_sensitive 2>/dev/null || true
          fi
          # Background apps: Batasi keras ke Core Little (A53) & cap max 30%
          if [ -d "/dev/cpuset/background" ]; then
            echo 0-3 > /dev/cpuset/background/cpus
            echo 0 > /dev/cpuctl/background/uclamp.min 2>/dev/null || true
            echo 30 > /dev/cpuctl/background/uclamp.max 2>/dev/null || true
          fi

          # ==============================================================
          # 2. Storage I/O: BFQ / Anxiety Low-Latency + 512KB Read-Ahead
          # ==============================================================
          for queue in /sys/block/*/queue; do
            [ -d "$queue" ] || continue
            # Coba set ke anxiety jika ada, fallback ke bfq
            if grep -q "anxiety" "$queue/scheduler"; then
              echo anxiety > "$queue/scheduler" 2>/dev/null || true
            else
              echo bfq > "$queue/scheduler" 2>/dev/null || true
              echo 1 > "$queue/iosched/low_latency" 2>/dev/null || true
              echo 0 > "$queue/iosched/slice_idle" 2>/dev/null || true
            fi
            echo 512 > "$queue/read_ahead_kb" 2>/dev/null || true
          done

          # ==============================================================
          # 3. Multi-Gen LRU (MGLRU) Aggressive Tiering
          # ==============================================================
          if [ -f "/sys/kernel/mm/lru_gen/enabled" ]; then
            echo 7 > /sys/kernel/mm/lru_gen/enabled
            echo 1000 > /sys/kernel/mm/lru_gen/min_ttl_ms 2>/dev/null || true
          fi

          # ==============================================================
          # 4. Kernel Samepage Merging (KSM) - Deduplikasi RAM ART
          # ==============================================================
          if [ -d "/sys/kernel/mm/ksm" ]; then
            echo 1 > /sys/kernel/mm/ksm/run
            echo 200 > /sys/kernel/mm/ksm/pages_to_scan
            echo 500 > /sys/kernel/mm/ksm/sleep_millisecs
            echo 1 > /sys/kernel/mm/ksm/deferred_timer 2>/dev/null || true
          fi

          # ==============================================================
          # 5. ZRAM Dynamic Reallocation (4GB ZSTD, Prioritas Tinggi)
          # ==============================================================
          if [ -b "/dev/block/zram0" ]; then
            swapoff /dev/block/zram0 2>/dev/null || true
            echo 1 > /sys/block/zram0/reset 2>/dev/null || true
            echo zstd > /sys/block/zram0/comp_algorithm 2>/dev/null || true
            echo 4294967296 > /sys/block/zram0/disksize 2>/dev/null || true
            mkswap /dev/block/zram0 2>/dev/null || true
            swapon /dev/block/zram0 -p 32758 2>/dev/null || true
          fi

          # ==============================================================
          # 6. Virtual Memory, VFS Choke Prevention & I/O Tuning
          # ==============================================================
          echo 0 > /proc/sys/vm/page-cluster
          echo 160 > /proc/sys/vm/swappiness
          echo 70 > /proc/sys/vm/vfs_cache_pressure
          echo 5 > /proc/sys/vm/dirty_ratio
          echo 2 > /proc/sys/vm/dirty_background_ratio
          echo 200 > /proc/sys/vm/dirty_expire_centisecs
          echo 300 > /proc/sys/vm/dirty_writeback_centisecs
          echo 0 > /proc/sys/vm/watermark_boost_factor
          echo 125 > /proc/sys/vm/watermark_scale_factor
          echo 24300 > /proc/sys/vm/extra_free_kbytes
          echo 11520 > /proc/sys/vm/min_free_kbytes
          echo 50 > /proc/sys/vm/compaction_proactiveness 2>/dev/null || true

          # ==============================================================
          # 7. Process Reclaim Background Compression
          # ==============================================================
          if [ -d "/sys/module/process_reclaim/parameters" ]; then
            echo 1 > /sys/module/process_reclaim/parameters/enable_process_reclaim
            echo 50 > /sys/module/process_reclaim/parameters/pressure_min
            echo 85 > /sys/module/process_reclaim/parameters/pressure_max
            echo 512 > /sys/module/process_reclaim/parameters/per_swap_size
            echo 10 > /sys/module/process_reclaim/parameters/swap_opt_eff
          fi

          # ==============================================================
          # 8. Android 16 SurfaceFlinger, LMKD & Real-Time UI Scheduling
          # ==============================================================
          setprop sys.use_fifo_ui 1
          setprop ro.lmk.kill_heaviest_task true
          setprop ro.lmk.use_psi true
          setprop ro.lmk.psi_complete_stall_ms 350
          setprop ro.lmk.psi_partial_stall_ms 100
          setprop ro.lmk.thrashing_limit 50
          setprop ro.lmk.thrashing_limit_decay 10
          setprop debug.sf.latch_unsignaled 1
          setprop debug.sf.disable_backpressure 1
          setprop debug.hwui.render_dirty_regions false
          setprop debug.hwui.use_buffer_age false

          # ==============================================================
          # 9. Network Bufferbloat Kill (Google BBR + FQ-CoDel)
          # ==============================================================
          echo fq_codel > /proc/sys/net/core/default_qdisc 2>/dev/null || true
          echo bbr > /proc/sys/net/ipv4/tcp_congestion_control 2>/dev/null || true
          SCRIPT
            chmod 755 /data/adb/service.d/99-godmode-potato-fog.sh
          fi
          EOF

          OUT_DIR="$GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot"

          # Salin file kernel hasil build
          if [ -f "$OUT_DIR/Image.gz-dtb" ]; then
            echo "Menemukan Image.gz-dtb"
            cp "$OUT_DIR/Image.gz-dtb" .
          elif [ -f "$OUT_DIR/Image.gz" ]; then
            echo "Menemukan Image.gz"
            cp "$OUT_DIR/Image.gz" .
          elif [ -f "$OUT_DIR/Image" ]; then
            echo "Menemukan Image"
            cp "$OUT_DIR/Image" .
          else
            echo "ERROR: Tidak ditemukan Image hasil kompilasi!"
            exit 1
          fi

          # Salin dtbo.img jika ada
          if [ -f "$OUT_DIR/dtbo.img" ]; then
            echo "Menemukan dtbo.img"
            cp "$OUT_DIR/dtbo.img" .
          fi

          # Salin dtb jika ada
          if [ -f "$OUT_DIR/dtb.img" ]; then
            echo "Menemukan dtb.img"
            cp "$OUT_DIR/dtb.img" dtb
          elif [ -f "$OUT_DIR/dtb" ]; then
            echo "Menemukan dtb"
            cp "$OUT_DIR/dtb" .
          fi

          DATE=$(date +'%Y%m%d-%H%M')
          ZIP_NAME="${KNAME}-SUSFS-GodmodePotato-fog-${DATE}.zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder

          mkdir -p "$GITHUB_WORKSPACE/output"
          mv "$ZIP_NAME" "$GITHUB_WORKSPACE/output/"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: output/*
          retention-days: 14
          compression-level: 6
