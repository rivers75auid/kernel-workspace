name: Build Redmi 10C Kernel (KernelSU-Next + SUSFS v2.3.0 + Godmode Potato Suite)

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: 'Custom Kernel Name (Tampil di Settings > About Phone)'
        required: true
        default: 'Kairos'
      KERNEL_REPO:
        description: 'Kernel Source Repository (owner/repo)'
        required: true
        default: 'alternoegraha/kernel_xiaomi_sm6225'
      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'fog'
      DEFCONFIG:
        description: 'Defconfig name'
        required: true
        default: 'vendor/fog-perf_defconfig'
      ENABLE_KSU_NEXT:
        description: 'Integrate KernelSU-Next'
        required: true
        type: boolean
        default: true
      ENABLE_SUSFS:
        description: 'Integrate SUSFS'
        required: true
        type: boolean
        default: true
      SUSFS_VERSION_TAG:
        description: 'SUSFS Header Version Tag'
        required: true
        default: 'v2.3.0'
      ENABLE_GODMODE_POTATO:
        description: 'Enable Godmode Suite (WALT/Schedtune, Anxiety I/O, MGLRU, KSM, ZRAM DEDUP, Zero-Debloat)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'configs/**'
      - 'scripts/**'
      - 'patches/**'

jobs:
  build:
    name: Compile Android Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python-is-python3 \
            python3 \
            tar \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Download Proton Clang Toolchain
        run: |
          echo "===> Downloading Proton Clang..."
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$GITHUB_WORKSPACE/proton-clang"

      - name: Clone Kernel Source
        run: |
          REPO="${{ github.event.inputs.KERNEL_REPO }}"
          [ -z "$REPO" ] && REPO="alternoegraha/kernel_xiaomi_sm6225"
          BRANCH="${{ github.event.inputs.KERNEL_BRANCH }}"
          [ -z "$BRANCH" ] && BRANCH="fog"

          echo "===> Cloning Canonical Kernel Source from $REPO ($BRANCH)..."
          git clone --depth=1 "https://github.com/$REPO.git" -b "$BRANCH" "$GITHUB_WORKSPACE/kernel_source"

      - name: Setup KernelSU-Next & SUSFS Patches
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"

          ENABLE_KSU="${{ github.event.inputs.ENABLE_KSU_NEXT }}"
          [ -z "$ENABLE_KSU" ] && ENABLE_KSU="true"
          ENABLE_SUS="${{ github.event.inputs.ENABLE_SUSFS }}"
          [ -z "$ENABLE_SUS" ] && ENABLE_SUS="true"
          SUS_VER="${{ github.event.inputs.SUSFS_VERSION_TAG }}"
          [ -z "$SUS_VER" ] && SUS_VER="v2.3.0"

          DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          [ -z "$DEFCONFIG" ] && DEFCONFIG="vendor/fog-perf_defconfig"
          DEFCONFIG_PATH="arch/arm64/configs/$DEFCONFIG"

          if [ "$ENABLE_KSU" = "true" ]; then
            echo "===> Mengintegrasikan KernelSU-Next (Legacy Branch v3.4.0 untuk Non-GKI 4.19)..."
            git clone --depth=1 -b v3.4.0-legacy https://github.com/KernelSU-Next/KernelSU-Next.git "$GITHUB_WORKSPACE/kernel_source/KernelSU-Next"

            mkdir -p drivers/kernelsu
            ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
            grep -q "kernelsu" drivers/Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> drivers/Makefile
            grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

            echo "===> Menerapkan hook reboot.c untuk handshake KernelSU..."
            python3 -c "
with open('kernel/reboot.c', 'r') as f:
    c = f.read()
hook = '''
#ifdef CONFIG_KSU
	{
		extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
		ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
		if (magic1 == 0xDEADBEEF)
			return 0;
	}
#endif
'''
target = '\t/* We only trust the superuser with rebooting the system. */'
if target in c and 'ksu_handle_sys_reboot' not in c:
    c = c.replace(target, hook + '\n' + target, 1)
    with open('kernel/reboot.c', 'w') as f:
        f.write(c)
    print('reboot.c hooked!')
"

            if [ "$ENABLE_SUS" = "true" ]; then
              echo "===> Mengambil Patch SUSFS 4.19 (Upstream simonpunk)..."
              git clone --depth=1 -b kernel-4.19 https://gitlab.com/simonpunk/susfs4ksu.git "$GITHUB_WORKSPACE/susfs4ksu"

              echo "===> Menyesuaikan versi SUSFS Header ke $SUS_VER..."
              sed -i "s/#define SUSFS_VERSION .*/#define SUSFS_VERSION \"$SUS_VER\"/" "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h"

              echo "===> Menerapkan source code SUSFS ke kernel..."
              cp -r "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs"/* fs/
              cp -r "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux"/* include/linux/

              echo "===> Menerapkan patch SUSFS ke kernel tree..."
              patch -p1 --forward < "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch" || echo "[WARN] Sebagian patch kernel mungkin sudah terpasang"

              echo "===> Menyiapkan inisialisasi SUSFS..."
              sed -i 's/void susfs_init(void) {/late_initcall(susfs_init);\nvoid susfs_init(void) {/' fs/susfs.c || true

              echo "===> Menambahkan definisi Kconfig SuSFS..."
              cat << 'EOF' >> KernelSU-Next/kernel/Kconfig

menu "KernelSU - SUSFS"
config KSU_SUSFS
    bool "KernelSU addon - SUSFS"
    depends on KSU
    default y

config KSU_SUSFS_HAS_MAGIC_MOUNT
    bool "Magic mount support"
    depends on KSU
    default y

config KSU_SUSFS_SUS_PATH
    bool "Hide suspicious path"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_SUS_MOUNT
    bool "Hide suspicious mounts"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
    bool "Auto add KSU default mount"
    depends on KSU_SUSFS_SUS_MOUNT
    default y

config KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
    bool "Auto add bind mount"
    depends on KSU_SUSFS_SUS_MOUNT
    default y

config KSU_SUSFS_SUS_KSTAT
    bool "Spoof kstat"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_SUS_OVERLAYFS
    bool "Spoof overlayfs"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_TRY_UMOUNT
    bool "Try umount"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
    bool "Auto add try umount for bind mount"
    depends on KSU_SUSFS_TRY_UMOUNT
    default y

config KSU_SUSFS_SPOOF_UNAME
    bool "Spoof uname"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_ENABLE_LOG
    bool "Enable log"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
    bool "Hide symbols"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
    bool "Spoof cmdline"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_OPEN_REDIRECT
    bool "Open redirect"
    depends on KSU_SUSFS
    default y

config KSU_SUSFS_SUS_SU
    bool "SUS SU"
    depends on KSU_SUSFS
    default n
endmenu
EOF
            fi

            echo "===> Mengaktifkan config KernelSU & SUSFS di defconfig..."
            cat "$GITHUB_WORKSPACE/configs/ksu_susfs.config" >> "$DEFCONFIG_PATH"
          fi

      - name: Apply Custom Kernel Name & Godmode Potato Optimizations
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"
          OPT_GOD="${{ github.event.inputs.ENABLE_GODMODE_POTATO }}"
          [ -z "$OPT_GOD" ] && OPT_GOD="true"
          KNAME="${{ github.event.inputs.KERNEL_NAME }}"
          [ -z "$KNAME" ] && KNAME="Kairos"

          DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          [ -z "$DEFCONFIG" ] && DEFCONFIG="vendor/fog-perf_defconfig"
          DEFCONFIG_PATH="arch/arm64/configs/$DEFCONFIG"

          echo "===> Menyetel Nama Kernel ke: $KNAME..."
          sed -i '/CONFIG_LOCALVERSION/d' "$DEFCONFIG_PATH"
          echo "CONFIG_LOCALVERSION=\"-${KNAME}\"" >> "$DEFCONFIG_PATH"

          echo "===> Memperbaiki duplikasi yamltree.o & hostprogs di scripts/dtc/Makefile..."
          cp "$GITHUB_WORKSPACE/patches/dtc_Makefile" scripts/dtc/Makefile

          if [ "$OPT_GOD" = "true" ]; then
            echo "===> Mengaktifkan Godmode Potato Suite (WALT/Schedtune, Anxiety, MGLRU, KSM, ZRAM DEDUP, Zero-Debloat)..."
            cat "$GITHUB_WORKSPACE/configs/godmode_potato.config" >> "$DEFCONFIG_PATH"
          fi

      - name: Build Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"
          DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          [ -z "$DEFCONFIG" ] && DEFCONFIG="vendor/fog-perf_defconfig"
          KNAME="${{ github.event.inputs.KERNEL_NAME }}"
          [ -z "$KNAME" ] && KNAME="Kairos"

          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KBUILD_BUILD_USER="${KNAME}-Dev"
          export KBUILD_BUILD_HOST="Olympus-Buildbox"

          mkdir -p out
          echo "===> Mengonfigurasi defconfig: $DEFCONFIG..."
          make -j$(nproc --all) ARCH=arm64 O=out "$DEFCONFIG"

          echo "===> Mengompilasi Kernel..."
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KSU_VERSION_OVERRIDE=33294 \
            KSU_VERSION_TAG_OVERRIDE=v3.4.0 \
            Image.gz-dtb dtbo.img dtb.img || \
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KSU_VERSION_OVERRIDE=33294 \
            KSU_VERSION_TAG_OVERRIDE=v3.4.0

      - name: Package with AnyKernel3
        run: |
          echo "===> Menyiapkan AnyKernel3..."
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"
          cd "$GITHUB_WORKSPACE/AnyKernel3"

          KNAME="${{ github.event.inputs.KERNEL_NAME }}"
          [ -z "$KNAME" ] && KNAME="Kairos"

          # Terapkan anykernel.sh terkonfigurasi khusus Redmi 10C (BLOCK=boot & slot auto)
          cp "$GITHUB_WORKSPACE/configs/anykernel.sh" .
          sed -i "s/Kairos/${KNAME}/g" anykernel.sh

          # Salin file script runtime Godmode Potato optimizer mandiri
          cp "$GITHUB_WORKSPACE/scripts/99-godmode-potato-fog.sh" .
          chmod 755 99-godmode-potato-fog.sh

          OUT_DIR="$GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot"

          # Salin file kernel hasil build
          if [ -f "$OUT_DIR/Image.gz-dtb" ]; then
            echo "Menemukan Image.gz-dtb"
            cp "$OUT_DIR/Image.gz-dtb" .
          elif [ -f "$OUT_DIR/Image.gz" ]; then
            echo "Menemukan Image.gz"
            cp "$OUT_DIR/Image.gz" .
          elif [ -f "$OUT_DIR/Image" ]; then
            echo "Menemukan Image"
            cp "$OUT_DIR/Image" .
          else
            echo "ERROR: Tidak ditemukan Image hasil kompilasi!"
            exit 1
          fi

          # Salin dtbo.img jika ada
          if [ -f "$OUT_DIR/dtbo.img" ]; then
            echo "Menemukan dtbo.img"
            cp "$OUT_DIR/dtbo.img" .
          fi

          # Salin dtb jika ada
          if [ -f "$OUT_DIR/dtb.img" ]; then
            echo "Menemukan dtb.img"
            cp "$OUT_DIR/dtb.img" dtb
          elif [ -f "$OUT_DIR/dtb" ]; then
            echo "Menemukan dtb"
            cp "$OUT_DIR/dtb" .
          fi

          DATE=$(date +'%Y%m%d-%H%M')
          ZIP_NAME="${KNAME}-SUSFS-GodmodePotato-fog-${DATE}.zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder

          mkdir -p "$GITHUB_WORKSPACE/output"
          mv "$ZIP_NAME" "$GITHUB_WORKSPACE/output/"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: output/*
          retention-days: 14
          compression-level: 6
