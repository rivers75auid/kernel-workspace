name: Android Kernel Build Engine (Custom Linux 4.19 Pipeline)

on:
  workflow_dispatch:
    inputs:
      KERNEL_NAME:
        description: 'Custom Kernel Name'
        required: true
        default: 'Kairos'
      KERNEL_REPO:
        description: 'Kernel Source Repository (owner/repo)'
        required: true
        default: 'rivers75auid/kernel_xiaomi_sm6225'
      KERNEL_BRANCH:
        description: 'Kernel Source Branch'
        required: true
        default: 'cirno-pin'
      DEFCONFIG:
        description: 'Defconfig name'
        required: true
        default: 'vendor/fog-perf_defconfig'
      ENABLE_RESUKISU:
        description: 'Integrate ReSukiSU'
        required: true
        type: boolean
        default: true
      ENABLE_SUSFS:
        description: 'Integrate SUSFS'
        required: true
        type: boolean
        default: true
      SUSFS_VERSION_TAG:
        description: 'SUSFS Header Version Tag'
        required: true
        default: 'v2.3.0'
      KSU_REF:
        description: 'BakaSU (ReSukiSU) ref to pin: tag, branch, or commit SHA'
        required: true
        default: '516d3e87fbc986ccefdde2c2765f1700612441a9'
      ENABLE_POTATO_SUITE:
        description: 'Enable Potato Tuning Suite (WALT/Schedtune, Anxiety I/O, MGLRU, KSM, ZRAM DEDUP, Zero-Debloat)'
        required: true
        type: boolean
        default: true
      ENABLE_NOMOUNT:
        description: 'Enable NoMount v2.2.0 Built-in VFS Redirection (CONFIG_NOMOUNT=y)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'configs/**'
      - 'scripts/**'
      - 'patches/**'

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kernel (SUSFS)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment & Dependencies
        timeout-minutes: 10
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo sed -i 's/#\$nrconf{restart} = '"'"'i'"'"';/\$nrconf{restart} = '"'"'a'"'"';/g' /etc/needrestart/needrestart.conf 2>/dev/null || true
          sudo apt-get update -y -o Acquire::Retries=3 -o Acquire::http::Timeout="30"
          sudo apt-get install -y --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confold" \
            -o Acquire::Retries=3 -o Acquire::http::Timeout="30" \
            bc \
            bison \
            build-essential \
            ca-certificates \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python-is-python3 \
            python3 \
            tar \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Download AOSP Clang 12 Toolchain (r416183b)
        run: |
          echo "===> Cloning AOSP Clang 12.0.5 (clang-r416183b)..."
          git clone --depth=1 --single-branch -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git \
            "$GITHUB_WORKSPACE/aosp-clang"
          "$GITHUB_WORKSPACE/aosp-clang/bin/clang" --version
          "$GITHUB_WORKSPACE/aosp-clang/bin/ld.lld" --version

      - name: Clone Kernel Source
        run: |
          REPO="${{ github.event.inputs.KERNEL_REPO }}"
          [ -z "$REPO" ] && REPO="rivers75auid/kernel_xiaomi_sm6225"
          BRANCH="${{ github.event.inputs.KERNEL_BRANCH }}"
          [ -z "$BRANCH" ] && BRANCH="cirno-pin"

          echo "===> Cloning Canonical Kernel Source from $REPO ($BRANCH)..."
          git clone --depth=1 "https://github.com/$REPO.git" -b "$BRANCH" "$GITHUB_WORKSPACE/kernel_source"

      - name: Setup ReSukiSU & SUSFS Patches
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/setup-ksu-susfs.sh"
          bash "$GITHUB_WORKSPACE/scripts/setup-ksu-susfs.sh" \
            "${{ github.event.inputs.ENABLE_RESUKISU || 'true' }}" \
            "${{ github.event.inputs.ENABLE_SUSFS || 'true' }}" \
            "${{ github.event.inputs.SUSFS_VERSION_TAG || 'v2.3.0' }}" \
            "${{ github.event.inputs.DEFCONFIG || 'vendor/fog-perf_defconfig' }}" \
            "${{ github.event.inputs.KSU_REF || '516d3e87fbc986ccefdde2c2765f1700612441a9' }}"

      - name: Setup NoMount Integration
        run: |
          chmod +x "$GITHUB_WORKSPACE/scripts/setup-nomount.sh"
          bash "$GITHUB_WORKSPACE/scripts/setup-nomount.sh" \
            "${{ github.event.inputs.ENABLE_NOMOUNT || 'true' }}" \
            "v2.2.0" \
            "${{ github.event.inputs.DEFCONFIG || 'vendor/fog-perf_defconfig' }}"

      - name: Apply Custom Kernel Name & Potato Suite Optimizations
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"
          OPT_POTATO="${{ github.event.inputs.ENABLE_POTATO_SUITE }}"
          [ -z "$OPT_POTATO" ] && OPT_POTATO="true"
          KNAME="${{ github.event.inputs.KERNEL_NAME }}"
          [ -z "$KNAME" ] && KNAME="Kairos"

          DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          [ -z "$DEFCONFIG" ] && DEFCONFIG="vendor/fog-perf_defconfig"
          FIRST_DEFCONFIG=$(echo "$DEFCONFIG" | awk '{print $1}')
          DEFCONFIG_PATH="arch/arm64/configs/$FIRST_DEFCONFIG"

          echo "===> Setting Kernel Name to: $KNAME..."
          sed -i '/CONFIG_LOCALVERSION/d' "$DEFCONFIG_PATH"
          echo "CONFIG_LOCALVERSION=\"-${KNAME}\"" >> "$DEFCONFIG_PATH"

          echo "===> Disabling conflicting I2C touchscreen drivers for Redmi 10C (fog SPI)..."
          sed -i '/CONFIG_TOUCHSCREEN_NT36XXX/d' "$DEFCONFIG_PATH" || true
          sed -i '/CONFIG_TOUCHSCREEN_FTS=/d' "$DEFCONFIG_PATH" || true
          sed -i '/CONFIG_TOUCHSCREEN_FTS_DIRECTORY/d' "$DEFCONFIG_PATH" || true
          echo "# CONFIG_TOUCHSCREEN_NT36XXX is not set" >> "$DEFCONFIG_PATH"
          echo "# CONFIG_TOUCHSCREEN_FTS is not set" >> "$DEFCONFIG_PATH"

          echo "===> Fixing yamltree.o duplicate & hostprogs in scripts/dtc/Makefile..."
          cp "$GITHUB_WORKSPACE/patches/dtc_Makefile" scripts/dtc/Makefile


          echo "===> Configuring touchscreen DT2W key mapping and gesture sysfs..."
          python3 "$GITHUB_WORKSPACE/scripts/patch-touch.py"

          echo "===> Enabling SMB1351 HVDCP_3 (Quick Charge 3.0) notification..."
          python3 "$GITHUB_WORKSPACE/scripts/patch-charger.py"

          echo "===> Porting fog charger (smb1351) + fuel gauge (sh366101) DT nodes..."
          python3 "$GITHUB_WORKSPACE/scripts/fog-charger-dt.py"

          echo "===> Fixing first-plug QC misclassification (delayed APSD rerun)..."
          python3 "$GITHUB_WORKSPACE/scripts/patch-charger-apsd.py"


          if [ "$OPT_POTATO" = "true" ]; then
            echo "===> Enabling Potato Tuning Suite (WALT/Schedtune, CFQ/BFQ, MGLRU, KSM, ZRAM DEDUP, Zero-Debloat)..."
            # Strip competing Kconfig choice defaults so potato.config wins cleanly
            sed -i '/CONFIG_CPU_FREQ_DEFAULT_GOV/d' "$DEFCONFIG_PATH"
            sed -i '/CONFIG_DEFAULT_IOSCHED/d' "$DEFCONFIG_PATH"
            sed -i '/CONFIG_DEFAULT_CFQ/d' "$DEFCONFIG_PATH"
            sed -i '/CONFIG_DEFAULT_WESTWOOD/d' "$DEFCONFIG_PATH"
            sed -i '/CONFIG_NET_ACT_/d' "$DEFCONFIG_PATH"
            sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' "$DEFCONFIG_PATH"
            echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> "$DEFCONFIG_PATH"
            cat "$GITHUB_WORKSPACE/configs/potato.config" >> "$DEFCONFIG_PATH"
          fi

      - name: Build Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_source"
          DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
          [ -z "$DEFCONFIG" ] && DEFCONFIG="vendor/fog-perf_defconfig"
          KNAME="${{ github.event.inputs.KERNEL_NAME }}"
          [ -z "$KNAME" ] && KNAME="Kairos"

          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="${KNAME}-Dev"
          export KBUILD_BUILD_HOST="Olympus-Buildbox"

          MAKE_ARGS=(
            ARCH=arm64
            O=out
            LLVM=1
            LLVM_IAS=1
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )

          mkdir -p out
          echo "===> Mengonfigurasi defconfig: $DEFCONFIG..."
          for cfg in $DEFCONFIG; do
            make -j$(nproc --all) "${MAKE_ARGS[@]}" $cfg
          done

          echo "===> Memaksa opsi CASS, Schedutil, PSI/MEMCG, ThinLTO, HZ_250, CFQ/BFQ & BBR di out/.config..."
          ./scripts/config --file out/.config \
            --enable CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
            --disable CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
            --disable SCHED_WALT \
            --disable SCHED_CORE_CTL \
            --enable SCHED_CASS \
            --enable PELT_COMPATIBILITY_LAYER \
            --enable UCLAMP_TASK \
            --enable UCLAMP_TASK_GROUP \
            --enable ENERGY_MODEL \
            --disable ANDROID_SIMPLE_LMK \
            --disable ANDROID_LOW_MEMORY_KILLER \
            --enable PSI \
            --disable PSI_DEFAULT_DISABLED \
            --enable MEMCG \
            --enable MEMCG_SWAP \
            --enable MEMCG_SWAP_ENABLED \
            --enable MEMCG_KMEM \
            --enable CGROUP_FREEZER \
            --enable LRU_GEN \
            --enable LRU_GEN_ENABLED \
            --disable HZ_100 \
            --enable HZ_250 \
            --disable LTO_NONE \
            --enable LTO_CLANG \
            --enable THINLTO \
            --disable SHADOW_CALL_STACK \
            --enable INIT_STACK_NONE \
            --disable INIT_STACK_ALL_PATTERN \
            --disable INIT_STACK_ALL_ZERO \
            --disable INIT_ON_FREE_DEFAULT_ON \
            --enable DEFAULT_CFQ \
            --enable DEFAULT_BBR \
            --disable DEFAULT_WESTWOOD \
            --enable NET_ACT_BPF \
            --enable NET_ACT_POLICE \
            --enable NET_ACT_CONNMARK \
            --disable ANDROID_PARANOID_NETWORK \
            --enable CRYPTO_CHACHA20POLY1305 \
            --enable XFRM_MIGRATE \
            --enable KALLSYMS \
            --enable KALLSYMS_ALL \
            --disable TOUCHSCREEN_NT36XXX \
            --disable TOUCHSCREEN_FTS \
            --disable RANDOMIZE_MODULE_REGION_FULL \
            --enable KPROBES

          # Resolve KSU hook choice cleanly without conflicting choice overrides
          ENABLE_SUS="${{ github.event.inputs.ENABLE_SUSFS || 'true' }}"
          if [ "$ENABLE_SUS" = "true" ]; then
            echo "===> Force KSU SuSFS Inline Hook mode (Non-GKI 4.19)..."
            ./scripts/config --file out/.config \
              --enable KSU \
              --disable KSU_TRACEPOINT_HOOK \
              --disable KSU_MANUAL_HOOK \
              --enable KSU_SUSFS
          else
            echo "===> Force KSU Manual Hook mode (Non-GKI 4.19)..."
            ./scripts/config --file out/.config \
              --enable KSU \
              --disable KSU_TRACEPOINT_HOOK \
              --disable KSU_SUSFS \
              --enable KSU_MANUAL_HOOK
          fi

          ENABLE_NOMOUNT="${{ github.event.inputs.ENABLE_NOMOUNT || 'true' }}"
          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            ./scripts/config --file out/.config --enable NOMOUNT
          else
            ./scripts/config --file out/.config --disable NOMOUNT
          fi

          echo "===> Menyelesaikan NEW symbols non-interaktif dengan LLVM=1..."
          make -j$(nproc --all) "${MAKE_ARGS[@]}" olddefconfig

          echo "===> Verifikasi hasil konfigurasi kritis:"
          grep -E "CONFIG_CC_IS_CLANG|CONFIG_LD_IS_LLD|CONFIG_LTO_CLANG|CONFIG_THINLTO|CONFIG_LTO_NONE|CONFIG_PSI|CONFIG_MEMCG|CONFIG_ANDROID_SIMPLE_LMK|CONFIG_LRU_GEN|CONFIG_ZRAM_DEF_COMP|CONFIG_ZRAM_WRITEBACK|CONFIG_UCLAMP_TASK|CONFIG_ENERGY_MODEL|CONFIG_SCHED_CASS|CONFIG_EROFS_FS|CONFIG_F2FS_FS_COMPRESSION|CONFIG_IOSCHED_BFQ|CONFIG_HZ_250|CONFIG_RD_LZ4|CONFIG_USERFAULTFD|CONFIG_CPU_FREQ_DEFAULT_GOV|CONFIG_DEFAULT_IOSCHED|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_ACT_BPF|CONFIG_ANDROID_PARANOID_NETWORK|CONFIG_RANDOMIZE_MODULE_REGION_FULL|CONFIG_KPROBES|CONFIG_NOMOUNT" out/.config || true
          echo "===> Verifikasi KSU hook mode & NoMount:"
          grep -E "CONFIG_KSU|CONFIG_NOMOUNT" out/.config || true
          if [ "$ENABLE_SUS" = "true" ]; then
            grep -q "^CONFIG_KSU_SUSFS=y$" out/.config || { echo "[-] ERROR: CONFIG_KSU_SUSFS=y missing!"; exit 1; }
          fi
          if [ "$ENABLE_NOMOUNT" = "true" ]; then
            grep -q "^CONFIG_NOMOUNT=y$" out/.config || { echo "[-] ERROR: CONFIG_NOMOUNT=y missing!"; exit 1; }
          fi

          echo "===> Mengompilasi Kernel (Image.gz & dtbo.img)..."
          make -j$(nproc --all) "${MAKE_ARGS[@]}" Image.gz dtbo.img

          OUT_DIR="$GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot"
          echo "===> Verifikasi Biner Kernel & DTBO Redmi 10C (fog / khaje)..."
          IMG_SIZE=$(stat -c %s "$OUT_DIR/Image.gz" 2>/dev/null || echo 0)
          DTBO_SIZE=$(stat -c %s "$OUT_DIR/dtbo.img" 2>/dev/null || echo 0)
          echo "Image.gz Size: $IMG_SIZE bytes | dtbo.img Size: $DTBO_SIZE bytes"
          if [ "$IMG_SIZE" -lt 10000000 ]; then
            echo "[-] FATAL: Image.gz terlalu kecil ($IMG_SIZE bytes)! Membatalkan build."
            exit 1
          fi
          if [ "$DTBO_SIZE" -lt 8000000 ]; then
            echo "[-] FATAL: dtbo.img hilang atau tidak lengkap ($DTBO_SIZE bytes)! Membatalkan build."
            exit 1
          fi
          echo "[+] VERIFIKASI LOLOS: Image.gz ($IMG_SIZE bytes) dan dtbo.img ($DTBO_SIZE bytes) siap dikemas!"

      - name: Build fgetpriority LKM (non-GKI 4.19)
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          KSRC="$GITHUB_WORKSPACE/kernel_source"
          mkdir -p "$GITHUB_WORKSPACE/output" "$GITHUB_WORKSPACE/module-fgetpriority/ko"

          echo "===> Cloning fgetpriority upstream (pinned v0.0.4)..."
          git clone --depth=1 -b v0.0.4 https://github.com/aerath-stuff/fgetpriority.git \
            "$GITHUB_WORKSPACE/fgetpriority-src"
          GOT=$(git -C "$GITHUB_WORKSPACE/fgetpriority-src" rev-parse HEAD)
          if [ "$GOT" != "be4ea47fa651c80a068e477d5a3627270b7bd683" ]; then
            echo "[!] fgetpriority-src HEAD bukan commit v0.0.4 yang di-pin! Got: $GOT"; exit 1
          fi

          REL=$(grep -h "define UTS_RELEASE" "$KSRC/out/include/generated/utsrelease.h" | cut -d'"' -f2)
          echo "===> Kernel release: $REL"
          printf '%s\n' "$REL" > "$GITHUB_WORKSPACE/output/utsrelease.txt"

          echo "===> Building fgetpriority.ko against O=out tree..."
          export CONFIG_FGETPRIORITY=m
          make -j$(nproc --all) -C "$KSRC" O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            M="$GITHUB_WORKSPACE/fgetpriority-src/kernel" \
            EXTRA_CFLAGS="-w" modules

          KO="$GITHUB_WORKSPACE/fgetpriority-src/kernel/fgetpriority.ko"
          [ -f "$KO" ] || { echo "[!] fgetpriority.ko tidak dihasilkan!"; exit 1; }

          echo "===> Signing module dengan key run ini (jika kernel pakai MODULE_SIG)..."
          if grep -q "^CONFIG_MODULE_SIG=y" "$KSRC/out/.config"; then
            KEY=$(find "$KSRC/out" "$KSRC/certs" -name signing_key.pem 2>/dev/null | head -1)
            [ -n "$KEY" ] || { echo "[!] MODULE_SIG=y tapi signing_key.pem tidak ditemukan!"; exit 1; }
            HASH=$(grep -oP 'CONFIG_MODULE_SIG_HASH="\K[^"]+' "$KSRC/out/.config" || echo sha512)
            "$KSRC/out/scripts/sign-file" "$HASH" "$KEY" "$KEY" "$KO"
            echo "===> Signed dengan $KEY (hash $HASH)"
          else
            echo "===> CONFIG_MODULE_SIG tidak aktif — skip signing"
          fi

          echo "===> Packing Magisk module zip..."
          cp "$KO" "$GITHUB_WORKSPACE/module-fgetpriority/ko/fog-4.19_arm64_fgetpriority.ko"
          cp "$KO" "$GITHUB_WORKSPACE/output/fog-4.19_arm64_fgetpriority.ko"
          (cd "$GITHUB_WORKSPACE/module-fgetpriority" && \
            zip -r9 "$GITHUB_WORKSPACE/output/fgetpriority_v0.0.5-4.19-fog.zip" ./* -x 'test-customize.sh')
          echo "===> fgetpriority artifacts ready"

      - name: Package with AnyKernel3
        run: |
          echo "===> Menyiapkan AnyKernel3..."
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"
          cd "$GITHUB_WORKSPACE/AnyKernel3"

          KNAME="${{ github.event.inputs.KERNEL_NAME }}"
          [ -z "$KNAME" ] && KNAME="Kairos"

          # Terapkan anykernel.sh terkonfigurasi khusus (BLOCK=boot & slot auto)
          cp "$GITHUB_WORKSPACE/configs/anykernel.sh" .
          sed -i "s/Kairos/${KNAME}/g" anykernel.sh

          OUT_DIR="$GITHUB_WORKSPACE/kernel_source/out/arch/arm64/boot"

          # Salin file kernel & dtbo hasil build (Sesuai arsitektur resmi Cirno: Image.gz + dtbo.img)
          if [ -f "$OUT_DIR/Image.gz" ]; then
            echo "Menemukan Image.gz"
            cp "$OUT_DIR/Image.gz" .
          else
            echo "ERROR: Image.gz tidak ditemukan!"
            exit 1
          fi

          if [ -f "$OUT_DIR/dtbo.img" ]; then
            echo "Menemukan dtbo.img (Cirno board overlays)"
            cp "$OUT_DIR/dtbo.img" .
          else
            echo "ERROR: dtbo.img tidak ditemukan!"
            exit 1
          fi

          echo "===> AnyKernel3: Menyertakan Image.gz dan dtbo.img sesuai arsitektur resmi Cirno..."

          DATE=$(date +'%Y%m%d-%H%M')
          ZIP_NAME="${KNAME}-SUSFS-Potato-fog-${DATE}.zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder

          mkdir -p "$GITHUB_WORKSPACE/output"
          mv "$ZIP_NAME" "$GITHUB_WORKSPACE/output/"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          # Package Kairos RAM Management Magisk/KSU module
          echo "===> Packaging Kairos RAM Management Module..."
          cd "$GITHUB_WORKSPACE/modules/kairos-memory-suite"
          zip -r9 "$GITHUB_WORKSPACE/output/Kairos-RAM-Management-v2.3.zip" ./*

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: output/*
          retention-days: 14
          compression-level: 6

      - name: Download matching BakaSU Manager APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KSU_REF="${{ github.event.inputs.KSU_REF || '516d3e87fbc986ccefdde2c2765f1700612441a9' }}"
          mkdir -p "$GITHUB_WORKSPACE/output"
          APK=""
          case "$KSU_REF" in
            *[!0-9a-f]* )
              APK=$(curl -s "https://api.github.com/repos/Baka-SU/BakaSU/releases/tags/${KSU_REF}" \
                | grep -o 'https://[^"]*arm64-v8a-release\.apk' | head -1)
              [ -n "$APK" ] && echo "===> Manager from release tag ${KSU_REF}"
              ;;
          esac
          if [ -z "$APK" ]; then
            RUN_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/Baka-SU/BakaSU/actions/workflows/217367501/runs?status=success&branch=main&per_page=1" \
              | grep -o '"id": [0-9]*' | head -1 | grep -o '[0-9]*')
            if [ -n "$RUN_ID" ]; then
              ART_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs/${RUN_ID}/artifacts" \
                | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d.get('artifacts',[]) if x['name']=='Manager-release']; print(a[0]['id'] if a else '')")
              if [ -n "$ART_ID" ]; then
                echo "===> Manager from BakaSU main CI run ${RUN_ID} (artifact ${ART_ID})"
                curl -sL -H "Authorization: token $GH_TOKEN" -o /tmp/mgr.zip \
                  "https://api.github.com/repos/Baka-SU/BakaSU/actions/artifacts/${ART_ID}/zip" \
                  || curl -sL -o /tmp/mgr.zip "https://nightly.link/Baka-SU/BakaSU/actions/artifacts/${ART_ID}.zip"
                unzip -o -q /tmp/mgr.zip -d /tmp/mgr
                APK=$(find /tmp/mgr -name "*arm64-v8a-release.apk" | head -1)
              fi
            fi
          fi
          if [ -z "$APK" ]; then
            echo "===> Fallback: latest release asset"
            APK=$(curl -s "https://api.github.com/repos/Baka-SU/BakaSU/releases/latest" \
              | grep -o 'https://[^"]*arm64-v8a-release\.apk' | head -1)
            [ -n "$APK" ] && curl -sL -o "$GITHUB_WORKSPACE/output/bakasu-manager.apk" "$APK"
          elif [[ "$APK" == http* ]]; then
            curl -sL -o "$GITHUB_WORKSPACE/output/bakasu-manager.apk" "$APK"
          else
            cp "$APK" "$GITHUB_WORKSPACE/output/bakasu-manager.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/output/bakasu-manager.apk" 2>/dev/null || echo "===> no manager apk this build"

      - name: Send Telegram Notification & File
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ] && exit 0

          JOB_STATUS="${{ job.status }}"
          VARIANT="SUSFS"
          ZIP_FILE="$GITHUB_WORKSPACE/output/${{ env.ZIP_NAME }}"

          if [ "$JOB_STATUS" = "success" ]; then
            MSG="✅ *Kernel Build Success!*%0A%0A*Device:* Redmi 10C (fog)%0A*Variant:* ${VARIANT}%0A*Package:* \`${{ env.ZIP_NAME }}\`%0A*Commit:* \`${{ github.sha }}\`"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=Markdown"

            if [ -f "$ZIP_FILE" ]; then
              FILE_SIZE=$(stat -c%s "$ZIP_FILE" 2>/dev/null || stat -f%z "$ZIP_FILE" 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -lt 49000000 ]; then
                echo "===> Uploading ZIP to Telegram..."
                curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                  -F "document=@${ZIP_FILE}" \
                  -F "caption=🚀 Flashable Kernel ZIP (${VARIANT})" \
                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
              fi
            fi

            MODULE_ZIP="$GITHUB_WORKSPACE/output/Kairos-RAM-Management-v2.3.zip"
            if [ -f "$MODULE_ZIP" ]; then
              echo "===> Uploading Kairos RAM Management Module to Telegram..."
              curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "document=@${MODULE_ZIP}" \
                -F "caption=📦 Built-in Memory Management Module" \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
            fi

            FGP_ZIP="$GITHUB_WORKSPACE/output/fgetpriority_v0.0.5-4.19-fog.zip"
            if [ -f "$FGP_ZIP" ]; then
              echo "===> Uploading fgetpriority Module to Telegram..."
              curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "document=@${FGP_ZIP}" \
                -F "caption=🛡 fgetpriority v0.0.5 (4.19 non-GKI fog) — pasangan kernel dari run ini" \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
            fi

            MANAGER_APK="$GITHUB_WORKSPACE/output/bakasu-manager.apk"
            if [ -f "$MANAGER_APK" ]; then
              echo "===> Uploading BakaSU Manager to Telegram..."
              curl -s -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "document=@${MANAGER_APK}" \
                -F "caption=📱 BakaSU Manager matching the pinned kernel integration" \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
            fi
          else
            MSG="❌ *Kernel Build Failed!*%0A%0A*Device:* Redmi 10C (fog)%0A*Variant:* ${VARIANT}%0A*Commit:* \`${{ github.sha }}\`%0A*Run:* [View Action Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=Markdown"
          fi
